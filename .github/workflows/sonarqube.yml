on:
  # Trigger analysis when pushing to your main branches, and when creating a pull request.
  push:
    branches:
      - main
      - master
      - develop
      - 'releases/**'
  pull_request:
      types: [opened, synchronize, reopened]

name: Main Workflow
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.2.0 # Ex: v4.1.0, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      with:
        projectKey: gkhnrsln_Simple-CRUD-Application
        organization: gkhnrsln
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        SONAR_ORGANIZATION: ${{ vars.ORGANIZATION }}
    - name: Debug SonarQube Variables
      run: |
        echo "SONAR_HOST_URL=${{ vars.SONAR_HOST_URL }}"
        echo "SONAR_PROJECT_KEY=${{ vars.SONAR_PROJECT_KEY }}"
        echo "SONAR_ORGANIZATION=${{ vars.SONAR_ORGANIZATION }}"
