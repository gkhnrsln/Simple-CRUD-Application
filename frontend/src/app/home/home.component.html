<h1 class="mt-5">{{title}}</h1>

<div class="container mt-5">
    <div class="row mt-5">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">
              Used technologies
            </h3>
            <ul>
              <li><a href="https://angular.dev">Angular (20)</a></li>
              <li><a href="https://getbootstrap.com">Bootstrap (5.3)</a></li>
              <li><a href="https://mariadb.org">MariaDB (Latest)</a></li>
              <li><a href="https://go.dev">Go (1.24)</a></li>
              <li><a href="https://www.docker.com">Docker</a></li>
            </ul>
          </div>
        </div>
      </div>
  
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">Random Quote</h3>
            @if (quotes.hasValue()) {
                <figure class="text-center mb-0">
                  <blockquote class="blockquote">
                    <p class="pb-3">
                      <i class="fas fa-quote-left fa-xs text-primary"></i>
                      <span class="lead font-italic">{{quotes.value()[0].quote}}</span>
                      <i class="fas fa-quote-right fa-xs text-primary"></i>
                    </p>
                  </blockquote>
                  <figcaption class="blockquote-footer mb-0">
                    {{quotes.value()[0].author}}
                  </figcaption>
                </figure>
            } @else if (quotes.error()) {
              <div class="text-center">Could not load quotes</div>
            } @else if (quotes.isLoading()) {
              <div class="text-center">
                <div class="spinner-border">
                  <span class="visually-hidden">Loading quotes...</span>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
